workflows:
  sonara-sim:
    name: Sonara - simulator build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: 16.2
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Build for iOS Simulator
        script: |
          xcodebuild build \
            -project Sonara.xcodeproj \
            -scheme Sonara \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  sonara-testflight:
    name: Sonara - TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      xcode: 16.2
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mhr.sonara
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Register bundle id & fetch/create signing profile
        script: |
          # Ensure the App ID exists on Apple's side, then fetch or CREATE
          # the app_store signing profile for it. This is what was missing.
          app-store-connect fetch-signing-files com.mhr.sonara \
            --type IOS_APP_STORE \
            --create
      - name: Add certificate to keychain & apply profiles
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Set unique build number
        script: agvtool new-version -all $(($BUILD_NUMBER + 1)) || true
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project Sonara.xcodeproj \
            --scheme Sonara
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
