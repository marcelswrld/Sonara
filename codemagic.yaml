workflows:
  sonara-sim:
    name: Sonara - simulator build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: 26.0
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Strip non-source files before generating project
        script: |
          # Remove git internals / sample hooks / docs so XcodeGen doesn't
          # sweep them into the app bundle (they break the archive).
          find . -name '*.sample' -delete 2>/dev/null || true
          rm -f *.md *.zip .gitattributes .gitignore 2>/dev/null || true
          echo "cleanup done"
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Build for iOS Simulator
        script: |
          xcodebuild build \
            -project Sonara.xcodeproj \
            -scheme Sonara \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  sonara-testflight:
    name: Sonara - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - appstore
      xcode: 26.0
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Strip non-source files before generating project
        script: |
          # Remove git internals / sample hooks / docs so XcodeGen doesn't
          # sweep them into the app bundle (they break the archive).
          find . -name '*.sample' -delete 2>/dev/null || true
          rm -f *.md *.zip .gitattributes .gitignore 2>/dev/null || true
          echo "cleanup done"
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Initialize keychain
        script: keychain initialize
      - name: Generate a certificate private key
        script: |
          mkdir -p $HOME/certs
          openssl genrsa -out $HOME/certs/cert_key.pem 2048
          echo "Certificate private key generated."
      - name: Fetch or create distribution certificate
        script: |
          app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --certificate-key=@file:$HOME/certs/cert_key.pem \
            --save \
          || app-store-connect certificates list \
            --type IOS_DISTRIBUTION \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --certificate-key=@file:$HOME/certs/cert_key.pem \
            --save
      - name: Create App ID and fetch/create provisioning profile
        script: |
          app-store-connect fetch-signing-files com.mhr.sonara \
            --platform IOS \
            --type IOS_APP_STORE \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --certificate-key=@file:$HOME/certs/cert_key.pem \
            --create
      - name: Add certificates to keychain and apply profiles
        script: |
          keychain add-certificates
          xcode-project use-profiles
      - name: Set unique build number
        script: agvtool new-version -all $(($BUILD_NUMBER + 1)) || true
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project Sonara.xcodeproj \
            --scheme Sonara
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
